<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Crest Shield -->
  <g transform="translate(15, 10)" filter="url(#shadow)">
    <!-- Outer Shield Border -->
    <path d="M 50 5 L 85 18 L 85 58 C 85 82 50 96 50 96 C 50 96 15 82 15 58 L 15 18 Z" 
          fill="url(#shieldGrad)" stroke="#fbbf24" stroke-width="2.5" />
    
    <!-- Inner Accent -->
    <path d="M 50 12 L 78 22 L 78 56 C 78 76 50 88 50 88 C 50 88 22 76 22 56 L 22 22 Z" 
          fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.2" />

    <!-- College Icon: Academic Cap & Open Book -->
    <!-- Open Book -->
    <path d="M 33 60 Q 50 54 67 60 L 67 72 Q 50 66 33 72 Z" fill="#ffffff" />
    <path d="M 50 56 L 50 71" stroke="#b91c1c" stroke-width="1.5" />
    <path d="M 36 63 Q 48 59 48 68" stroke="#b91c1c" stroke-width="0.8" fill="none" />
    <path d="M 64 63 Q 52 59 52 68" stroke="#b91c1c" stroke-width="0.8" fill="none" />

    <!-- Mortarboard (Academic Cap) -->
    <polygon points="50,25 72,34 50,43 28,34" fill="url(#goldGrad)" />
    <path d="M 39 39 L 39 48 Q 50 53 61 48 L 61 39" fill="url(#goldGrad)" opacity="0.9" />
    <!-- Tassel -->
    <path d="M 72 34 L 74 46" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="74" cy="47" r="2" fill="#ffffff" />
  </g>

  <!-- Typography Brand -->
  <g transform="translate(118, 25)">
    <!-- College Tagline / Crest Subtext -->
    <text x="0" y="20" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="12" font-weight="700" letter-spacing="2.5" fill="#dc2626" text-transform="uppercase">
      OPP. VIGNAN UNIVERSITY
    </text>

    <!-- Main Title -->
    <text x="0" y="52" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="28" font-weight="800" letter-spacing="-0.5" fill="currentColor" class="logo-title-text">
      SRI RAM
    </text>

    <!-- Subtitle / Highlight -->
    <text x="135" y="52" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="28" font-weight="800" letter-spacing="-0.5" fill="#dc2626">
      PG
    </text>

    <text x="0" y="72" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="11" font-weight="500" letter-spacing="1" fill="#64748b">
      Vadlamudi, Guntur • Student Living
    </text>
  </g>
</svg>
