<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRI RAM PG</title>
  
  <!-- Favicon / Shield Icon -->
  <link rel="icon" type="image/svg+xml" href="./assets/images/college-logo.svg">
  
  <!-- Inter Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Local Vendor Scripts (Offline-first with CDN fallbacks) -->
  <script src="./vendor/lucide.min.js"></script>
  <script>
    if (!window.lucide) {
      document.write('<script src="https://unpkg.com/lucide@latest"><\/script>');
    }
  </script>
  
  <script src="./vendor/chart.min.js"></script>
  <script>
    if (!window.Chart) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/chart.js"><\/script>');
    }
  </script>
  
  <script src="./vendor/jspdf.umd.min.js"></script>
  <script src="./vendor/jspdf.plugin.autotable.min.js"></script>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="./css/theme.css?v=vignan_32">
  <link rel="stylesheet" href="./css/styles.css?v=vignan_32">
  <link rel="stylesheet" href="./css/responsive.css?v=vignan_32">

  <!-- Immediate Theme Initializer to prevent flash -->
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('pg_hostel_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
      } catch(e) {}
    })();
  </script>
</head>
<body>

  <!-- Root App Mount Point -->
  <div id="app-root">
    <!-- Will dynamically render either Login View or Authenticated App Shell -->
    <div style="display:flex;height:100vh;align-items:center;justify-content:center;background:var(--bg-app);">
      <div style="text-align:center;">
        <div style="width:48px;height:48px;border:3px solid var(--border-color);border-top-color:var(--primary-red);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 1rem;"></div>
        <p style="font-weight:600;color:var(--text-muted);">Loading SRI RAM PG...</p>
      </div>
    </div>
  </div>

  <!-- Global Modal Root Container -->
  <div id="modal-root"></div>

  <!-- Global Toast Notifications Container -->
  <div id="toast-root" class="toast-container"></div>

  <!-- Floating AI Assistant Button (Rendered when authenticated) -->
  <button id="ai-assistant-btn" class="ai-assistant-fab" title="Open AI Hostel Assistant" style="display:none;" onclick="App.toggleAiAssistant()">
    <i data-lucide="bot"></i>
  </button>

  <style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>

  <!-- Modular Scripts -->
  <script src="./js/config.js?v=vignan_online"></script>
  <script src="./js/api.js?v=vignan_online"></script>
  <script src="./js/utils.js?v=vignan_online"></script>
  <script src="./js/components/toast.js?v=vignan_32"></script>
  <script src="./js/components/modal.js?v=vignan_32"></script>
  <script src="./js/components/header.js?v=vignan_student_photo"></script>
  <script src="./js/components/sidebar.js?v=vignan_32"></script>
  <script src="./js/components/notificationCenter.js?v=vignan_32"></script>
  
  <!-- Pages -->
  <script src="./js/pages/login.js?v=vignan_ghpages_fix"></script>
  <script src="./js/pages/adminDashboard.js?v=vignan_ghpages_fix"></script>
  <script src="./js/pages/students.js?v=vignan_ghpages_fix"></script>
  <script src="./js/pages/studentProfile.js?v=vignan_ghpages_fix"></script>
  <script src="./js/pages/hostelStructure.js?v=vignan_ghpages_fix"></script>
  <script src="./js/pages/roomDetailModal.js?v=vignan_ghpages_fix"></script>
  <script src="./js/pages/addStudentModal.js?v=vignan_ghpages_fix"></script>
  <script src="./js/pages/fees.js?v=vignan_ghpages_fix"></script>
  <script src="./js/pages/payments.js?v=vignan_ghpages_fix"></script>
  <script src="./js/pages/receiptModal.js?v=vignan_ghpages_fix"></script>
  <script src="./js/pages/complaints.js?v=vignan_ghpages_fix"></script>
  <script src="./js/pages/visitors.js?v=vignan_ghpages_fix"></script>
  <script src="./js/pages/mess.js?v=vignan_ghpages_fix"></script>
  <script src="./js/pages/expenses.js?v=vignan_ghpages_fix"></script>
  <script src="./js/pages/reports.js?v=vignan_ghpages_fix"></script>
  <script src="./js/pages/announcements.js?v=vignan_ghpages_fix"></script>
  <script src="./js/pages/leaveRequests.js?v=vignan_ghpages_fix"></script>
  <script src="./js/pages/aiAssistant.js?v=vignan_ghpages_fix"></script>
  <script src="./js/pages/studentDashboard.js?v=vignan_ghpages_fix"></script>
  <script src="./js/pages/settings.js?v=vignan_ghpages_fix"></script>

  <!-- Main App Router & State Manager -->
  <script src="./js/app.js?v=vignan_ghpages_fix"></script>

  <!-- Boot Watchdog: Guarantee App is initialized even if DOMContentLoaded already passed -->
  <script>
    (function() {
      function safeBoot() {
        if (typeof App !== 'undefined' && typeof App.init === 'function') {
          try {
            App.init();
          } catch(e) {
            console.error('SafeBoot failed:', e);
            if (typeof LoginPage !== 'undefined' && typeof LoginPage.render === 'function') {
              var root = document.getElementById('app-root');
              if (root) {
                root.innerHTML = LoginPage.render();
                if (typeof LoginPage.initSlider === 'function') LoginPage.initSlider();
                if (typeof Utils !== 'undefined') Utils.renderIcons();
              }
            }
          }
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', safeBoot);
      } else {
        safeBoot();
      }

      // Fallback timer: Never leave user on spinner
      setTimeout(function() {
        var root = document.getElementById('app-root');
        if (root && root.innerHTML.indexOf('Loading SRI RAM PG Portal...') !== -1) {
          console.warn('[Watchdog] Fallback rendering login page...');
          safeBoot();
        }
      }, 2000);
    })();
  </script>
</body>
</html>
